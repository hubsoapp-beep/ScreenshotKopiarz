name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Verify binary
        run: test -x build/ScreenshotKopiarz.app/Contents/MacOS/ScreenshotKopiarz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotKopiarz
          path: build/ScreenshotKopiarz.app
          if-no-files-found: error
